<body class="invoice-document-page">
  <main class="invoice-document-shell">
    <div class="invoice-document-actions" aria-label="Invoice actions">
      <a class="btn-portal btn-ghost" href="/portal/admin/invoices/">← Invoices</a>
      <button id="printInvoiceBtn" class="btn-portal btn-primary" type="button">Print / save PDF</button>
    </div>
    <div id="loadingState" class="portal-loading"><div class="loading-dots"><span></span><span></span><span></span></div><p>Preparing invoice…</p></div>
    <div id="notAuthState" class="portal-empty-screen" hidden><h1>Admin access required</h1><p>Sign in to produce this invoice.</p><a href="/portal/admin/" class="btn-portal btn-primary">Go to admin login</a></div>
    <div id="invoiceDocument" hidden></div>
  </main>
  <script src="/js/portal-invoice-print.js?v=20260811invoiceprint1"></script>
</body>
